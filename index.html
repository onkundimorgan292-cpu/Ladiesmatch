<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ladies Maker Supermarket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; color: #222; padding-bottom: 80px; }
    
    header { background: #1b5e20; color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    header p { font-size: 0.9rem; opacity: 0.9; }

    .controls { max-width: 1100px; margin: 20px auto; padding: 0 16px; }
    .search-box { width: 100%; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; }
    
    .categories { display: flex; gap: 8px; flex-wrap: wrap; }
    .cat-btn { background: white; border: 1px solid #1b5e20; color: #1b5e20; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .cat-btn.active, .cat-btn:hover { background: #1b5e20; color: white; }

    .grid { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 160px; object-fit: cover; background: #e9ecef; }
    .card-body { padding: 14px; }
    .badge { display: inline-block; font-size: 0.75rem; background: #e8f5e9; color: #1b5e20; padding: 3px 8px; border-radius: 4px; margin-bottom: 6px; font-weight: 600; }
    .card h3 { font-size: 1rem; margin-bottom: 8px; }
    .price { font-size: 1.15rem; font-weight: bold; color: #1b5e20; margin-bottom: 10px; }
    
    .add-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #1b5e20; color: white; font-weight: bold; cursor: pointer; }
    .add-btn:hover { background: #144718; }
    .add-btn:disabled { background: #bbb; cursor: not-allowed; }

    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 200; }
    .order-btn { background: #25D366; color: #000; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>
    <h1>Ladies Maker Supermarket</h1>
    <p>Fresh groceries & household essentials — Order online for fast delivery or pickup</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="Search products (e.g., milk, sugar, oil)..." onkeyup="filterProducts()" />
    <div class="categories" id="categoryButtons">
      <button class="cat-btn active" onclick="selectCategory('All', this)">All</button>
    </div>
  </div>

  <div id="product-list" class="grid"></div>

  <div class="cart-bar">
    <div>
      <strong>Cart:</strong> <span id="cartCount">0</span> items | 
      <strong>Total: KES <span id="cartTotal">0</span></strong>
    </div>
    <button class="order-btn" onclick="sendWhatsAppOrder()">Order via WhatsApp</button>
  </div>

  <script>
    // CHANGE THIS TO YOUR STORE WHATSAPP NUMBER (Format: 2547XXXXXXXX)
    const WHATSAPP_NUMBER = "254700000000";

    let allProducts = [];
    let currentCategory = "All";
    let cart = [];

    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        allProducts = data;
        setupCategories(data);
        renderProducts(data);
      });

    function setupCategories(products) {
      const categories = [...new Set(products.map(p => p.category))];
      const container = document.getElementById('categoryButtons');
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn';
        btn.textContent = cat;
        btn.onclick = () => selectCategory(cat, btn);
        container.appendChild(btn);
      });
    }

    function selectCategory(category, btnElement) {
      currentCategory = category;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      filterProducts();
    }

    function filterProducts() {
      const searchText = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(item => {
        const matchesCat = currentCategory === "All" || item.category === currentCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchText);
        return matchesCat && matchesSearch;
      });
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const container = document.getElementById('product-list');
      container.innerHTML = '';
      products.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Ladies+Maker'">
          <div class="card-body">
            <span class="badge">${item.category}</span>
            <h3>${item.name}</h3>
            <div class="price">KES ${item.price.toLocaleString()}</div>
            <button class="add-btn" ${!item.inStock ? 'disabled' : ''} onclick="addToCart(${item.id})">
              ${item.inStock ? '+ Add to Cart' : 'Out of Stock'}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addToCart(id) {
      const product = allProducts.find(p => p.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      updateCartBar();
    }

    function updateCartBar() {
      const count = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = total.toLocaleString();
    }

    function sendWhatsAppOrder() {
      if (cart.length === 0) {
        alert("Your cart is empty! Add some items first.");
        return;
      }
      let message = "Hello Ladies Maker Supermarket, I would like to order:%0A%0A";
      let total = 0;
      cart.forEach(item => {
        const lineTotal = item.price * item.qty;
        total += lineTotal;
        message += `- ${item.name} x${item.qty} = KES ${lineTotal.toLocaleString()}%0A`;
      });
      message += `%0A*Total: KES ${total.toLocaleString()}*`;
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank');
    }
  </script>
</body>
</html>
